services:
  cilo:
    build: .
    image: cilo:local
    ports:
      - "${CILO_BIND_ADDRESS:-127.0.0.1}:${CILO_PORT:-3000}:3000"
    environment:
      CILO_DATA_DIR: /app/data
      CILO_PUBLIC_URL: ${CILO_PUBLIC_URL:-}
    volumes:
      - cilo-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/cilo/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cilo-data:
