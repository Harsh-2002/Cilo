services:
  nivra:
    build: .
    image: nivra:local
    ports:
      - "0.0.0.0:${NIVRA_PORT:-3000}:3000"
    environment:
      NIVRA_DATA_DIR: /app/data
      NIVRA_PUBLIC_URL: ${NIVRA_PUBLIC_URL:-}
      NIVRA_UPLOAD_LIMIT_MIB: ${NIVRA_UPLOAD_LIMIT_MIB:-25}
      NIVRA_STORAGE_BACKEND: ${NIVRA_STORAGE_BACKEND:-local}
      NIVRA_ENCRYPTION_ENABLED: ${NIVRA_ENCRYPTION_ENABLED:-}
      NIVRA_ENCRYPTION_KEY: ${NIVRA_ENCRYPTION_KEY:-}
      NIVRA_ENCRYPTION_KEY_FILE: ${NIVRA_ENCRYPTION_KEY_FILE:-}
      NIVRA_S3_ENDPOINT: ${NIVRA_S3_ENDPOINT:-}
      NIVRA_S3_REGION: ${NIVRA_S3_REGION:-us-east-1}
      NIVRA_S3_BUCKET: ${NIVRA_S3_BUCKET:-}
      NIVRA_S3_ACCESS_KEY_ID: ${NIVRA_S3_ACCESS_KEY_ID:-}
      NIVRA_S3_SECRET_ACCESS_KEY: ${NIVRA_S3_SECRET_ACCESS_KEY:-}
      NIVRA_S3_PREFIX: ${NIVRA_S3_PREFIX:-nivra/}
      NIVRA_S3_FORCE_PATH_STYLE: ${NIVRA_S3_FORCE_PATH_STYLE:-true}
      NIVRA_S3_BACKUP_ENABLED: ${NIVRA_S3_BACKUP_ENABLED:-}
      # Compatibility for established backup destinations; new setups reuse NIVRA_S3_* above.
      NIVRA_BACKUP_BACKEND: ${NIVRA_BACKUP_BACKEND:-}
      NIVRA_BACKUP_DIR: ${NIVRA_BACKUP_DIR:-}
      NIVRA_BACKUP_INTERVAL_HOURS: ${NIVRA_BACKUP_INTERVAL_HOURS:-24}
      NIVRA_BACKUP_KEEP: ${NIVRA_BACKUP_KEEP:-7}
      NIVRA_BACKUP_S3_ENDPOINT: ${NIVRA_BACKUP_S3_ENDPOINT:-}
      NIVRA_BACKUP_S3_REGION: ${NIVRA_BACKUP_S3_REGION:-}
      NIVRA_BACKUP_S3_BUCKET: ${NIVRA_BACKUP_S3_BUCKET:-}
      NIVRA_BACKUP_S3_ACCESS_KEY_ID: ${NIVRA_BACKUP_S3_ACCESS_KEY_ID:-}
      NIVRA_BACKUP_S3_SECRET_ACCESS_KEY: ${NIVRA_BACKUP_S3_SECRET_ACCESS_KEY:-}
      NIVRA_BACKUP_S3_PREFIX: ${NIVRA_BACKUP_S3_PREFIX:-nivra-backups/}
      NIVRA_BACKUP_S3_FORCE_PATH_STYLE: ${NIVRA_BACKUP_S3_FORCE_PATH_STYLE:-}
    volumes:
      - nivra-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/nivra/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nivra-data:
    name: ${NIVRA_DATA_VOLUME:-${COMPOSE_PROJECT_NAME}_nivra-data}
